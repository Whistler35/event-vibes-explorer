<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
  html,body { width:1290px; height:2796px; overflow:hidden; }
  body { background:#F4F3ED; position:relative; }
  .pill {
    position:absolute; top:168px; left:50%; transform:translateX(-50%);
    padding:20px 34px; border-radius:999px; background:#E7E4DA;
    font-weight:800; font-size:23px; letter-spacing:3.5px; color:#4A4A40; text-transform:uppercase;
  }
  .headline {
    position:absolute; top:272px; left:0; right:0; text-align:center;
    font-weight:800; font-size:96px; line-height:1.04; letter-spacing:-2px; color:#131711;
  }
  .headline .accent { background:#C8F14F; padding:0 6px; }
  .sub {
    position:absolute; top:520px; left:50%; transform:translateX(-50%); width:940px; text-align:center;
    font-weight:500; font-size:40px; line-height:1.45; color:#79826F;
  }
  .phone {
    position:absolute; top:758px; left:50%; transform:translateX(-50%);
    width:1010px; height:2100px;
    background:#0A0A0A; border-radius:150px; padding:22px;
    box-shadow: 0 60px 140px -30px rgba(0,0,0,0.35);
  }
  .phone-screen { position:relative; width:100%; height:100%; border-radius:132px; overflow:hidden; background:#1E3323; }
  .notch { position:absolute; top:22px; left:50%; transform:translateX(-50%); width:230px; height:44px; background:#0A0A0A; border-radius:30px; z-index:5; }
  .statusbar { display:flex; align-items:center; justify-content:space-between; padding:38px 56px 0 64px; color:#fff; font-weight:700; font-size:30px; }
  .statusbar .icons { display:flex; align-items:center; gap:14px; }
  .formhead { padding:36px 56px 0 56px; display:flex; align-items:center; gap:22px; }
  .formhead .ic { width:72px; height:72px; border-radius:22px; background:rgba(200,241,79,0.18); display:flex; align-items:center; justify-content:center; }
  .formhead .tt { color:rgba(255,255,255,0.5); font-weight:700; font-size:24px; letter-spacing:2px; }
  .formhead .tt2 { color:#fff; font-weight:800; font-size:40px; margin-top:4px; }
  .label { padding:0 56px; margin-top:52px; color:rgba(255,255,255,0.45); font-weight:700; font-size:24px; letter-spacing:2px; }
  .field { padding:0 56px; margin-top:20px; color:#fff; font-weight:600; font-size:42px; padding-bottom:26px; border-bottom:2px solid rgba(255,255,255,0.18); margin-left:56px; margin-right:56px; }
  .pillrow { padding:0 56px; margin-top:28px; display:flex; gap:20px; }
  .pbtn { flex:1; text-align:center; padding:30px 0; border-radius:26px; border:2px solid rgba(255,255,255,0.18); color:#fff; font-weight:700; font-size:30px; }
  .pbtn.sel { border-color:#C8F14F; color:#C8F14F; }
  .slider { padding:0 56px; margin-top:16px; }
  .track { height:10px; background:rgba(255,255,255,0.15); border-radius:10px; position:relative; margin-top:10px; }
  .track .fill { position:absolute; left:0; top:0; bottom:0; width:12%; background:#C8F14F; border-radius:10px; }
  .track .knob { position:absolute; left:12%; top:50%; transform:translate(-50%,-50%); width:44px; height:44px; background:#fff; border-radius:999px; box-shadow:0 6px 14px rgba(0,0,0,0.3); }
  .scalerow { display:flex; justify-content:space-between; margin-top:18px; color:rgba(255,255,255,0.4); font-weight:600; font-size:24px; }
  .scalerow .mid { color:#C8F14F; }
  .vrow { padding:0 56px; margin-top:28px; display:flex; gap:20px; }
  .vbtn { flex:1; text-align:center; padding:28px 0; border-radius:26px; border:2px solid rgba(255,255,255,0.18); color:rgba(255,255,255,0.55); font-weight:700; font-size:26px; }
  .vbtn.sel { border-color:#C8F14F; color:#C8F14F; }
  .vbtn svg { display:block; margin:0 auto 10px auto; }
  .locbar { margin:40px 56px 0 56px; border:2px solid rgba(255,255,255,0.18); border-radius:26px; padding:26px 30px; display:flex; align-items:center; gap:14px; color:rgba(255,255,255,0.6); font-weight:600; font-size:26px; }
  .cta { position:absolute; left:56px; right:56px; bottom:70px; background:#C8F14F; color:#1E3323; text-align:center; padding:40px 0; border-radius:999px; font-weight:800; font-size:38px; letter-spacing:1px; box-shadow:0 30px 60px -10px rgba(200,241,79,0.5); display:flex; align-items:center; justify-content:center; gap:16px; }
</style>
</head>
<body>
  <div class="pill">STEP 1</div>
  <div class="headline">Send a <span class="accent">Blitz</span><br>in seconds</div>
  <div class="sub">Say what you're up for, how long<br>and who can see it.</div>

  <div class="phone">
    <div class="phone-screen">
      <div class="notch"></div>
      <div class="statusbar">
        <span>9:41</span>
        <div class="icons">
          <svg width="34" height="24" viewBox="0 0 34 24" fill="#fff"><rect x="0" y="16" width="6" height="8" rx="1"/><rect x="9" y="11" width="6" height="13" rx="1"/><rect x="18" y="6" width="6" height="18" rx="1"/><rect x="27" y="0" width="6" height="24" rx="1"/></svg>
          <svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="#fff" stroke-width="2.4"><path d="M2 8c7-7 19-7 26 0M6 13c5-4.5 13-4.5 18 0M10.5 17.5c2.7-2.3 6.3-2.3 9 0"/><circle cx="15" cy="20.5" r="1.4" fill="#fff" stroke="none"/></svg>
          <svg width="48" height="24" viewBox="0 0 48 24"><rect x="1" y="1" width="40" height="22" rx="6" stroke="#fff" stroke-width="2" fill="none"/><rect x="4" y="4" width="32" height="16" rx="3" fill="#fff"/><rect x="43" y="8" width="3" height="8" rx="1.5" fill="#fff"/></svg>
        </div>
      </div>
      <div class="formhead">
        <div class="ic"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#C8F14F" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg></div>
        <div><div class="tt">BLITZ</div><div class="tt2">Spontaneous request</div></div>
      </div>
      <div class="label">WHAT ARE YOU UP FOR?</div>
      <div class="field">Grab a coffee ☕?</div>
      <div class="label">VISIBLE FOR HOW LONG?</div>
      <div class="pillrow">
        <div class="pbtn">30 min</div>
        <div class="pbtn">1h</div>
        <div class="pbtn sel">2h</div>
      </div>
      <div class="label" style="margin-top:46px;">RADIUS</div>
      <div class="slider">
        <div class="track"><div class="fill"></div><div class="knob"></div></div>
        <div class="scalerow"><span>1 KM</span><span class="mid">5 KM</span><span>50 KM</span></div>
      </div>
      <div class="label" style="margin-top:46px;">VISIBILITY</div>
      <div class="vrow">
        <div class="vbtn sel"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C8F14F" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18 14 14 0 010-18z"/></svg>PUBLIC</div>
        <div class="vbtn"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/></svg>FRIENDS</div>
        <div class="vbtn"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M16 5l2 2 3-3" stroke-width="2.2"/></svg>SELECT</div>
      </div>
      <div class="locbar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C8F14F" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>Location on · visible within 5 km</div>
      <div class="cta"><svg width="34" height="34" viewBox="0 0 24 24" fill="#1E3323"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>BLITZ NOW</div>
    </div>
  </div>
</body>
</html>
