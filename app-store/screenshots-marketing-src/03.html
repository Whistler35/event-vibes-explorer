<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
  html,body { width:1290px; height:2796px; overflow:hidden; }
  body {
    background: radial-gradient(ellipse 900px 700px at 50% 20%, #24392A 0%, #15241A 55%, #0E1A12 100%);
    position:relative;
  }
  .pill {
    position:absolute; top:168px; left:50%; transform:translateX(-50%);
    padding:20px 34px; border-radius:999px;
    border:1.5px solid rgba(200,241,79,0.45);
    background:rgba(200,241,79,0.07);
    white-space:nowrap;
    color:#C8F14F; font-weight:800; font-size:23px; letter-spacing:3.5px; text-transform:uppercase;
  }
  .stamp {
    position:absolute; top:560px; left:50%; transform:translateX(-50%) rotate(-7deg);
    border:5px solid #C8F14F; border-radius:30px; padding:24px 48px;
    display:flex; align-items:center; gap:16px;
  }
  .stamp span { color:#C8F14F; font-weight:800; font-size:62px; letter-spacing:1px; }
  .headline {
    position:absolute; top:258px; left:0; right:0; text-align:center;
    font-weight:800; font-size:96px; line-height:1.04; letter-spacing:-2px;
    color:#FFFFFF;
  }
  .headline .accent { color:#C8F14F; }
  .sub {
    position:absolute; top:520px; left:50%; transform:translateX(-50%); width:900px; text-align:center;
    font-weight:500; font-size:40px; line-height:1.45; color:rgba(255,255,255,0.68);
  }
  .phone {
    position:absolute; top:758px; left:50%; transform:translateX(-50%);
    width:1010px; height:1900px;
    background:#0A0A0A; border-radius:150px;
    padding:22px;
    box-shadow: 0 60px 140px -30px rgba(0,0,0,0.6);
  }
  .phone-screen {
    position:relative; width:100%; height:100%; border-radius:132px; overflow:hidden;
    background:#F4F3ED;
  }
  .statusbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:38px 56px 0 64px; color:#131711; font-weight:700; font-size:30px;
  }
  .statusbar .icons { display:flex; align-items:center; gap:14px; }
  .notch {
    position:absolute; top:22px; left:50%; transform:translateX(-50%);
    width:230px; height:44px; background:#0A0A0A; border-radius:30px; z-index:5;
  }
  .appbar {
    display:flex; align-items:center; justify-content:space-between; padding:30px 48px 0 48px;
  }
  .appbar .logo { font-weight:800; font-size:34px; letter-spacing:1px; color:#131711; }
  .tabs {
    margin:34px 48px 0 48px; background:#E7E4DA; border-radius:999px; padding:8px; display:flex;
  }
  .tab { flex:1; text-align:center; padding:22px 0; border-radius:999px; font-weight:700; font-size:26px; letter-spacing:1px; }
  .tab.active { background:#1E3323; color:#fff; }
  .tab.inactive { color:#8A8A80; }
  .card {
    margin:40px 48px 0 48px; background:#1E3323; border-radius:62px;
    padding:50px 46px 70px 46px; position:relative; min-height:1100px;
    box-shadow: inset 0 0 0 4px rgba(200,241,79,0.55);
  }
  .card-top { display:flex; align-items:center; justify-content:space-between; }
  .chip { display:inline-flex; align-items:center; gap:10px; background:rgba(0,0,0,0.25); border:1.5px solid rgba(255,255,255,0.15); color:#C8F14F; font-weight:700; font-size:26px; padding:14px 24px; border-radius:999px; }
  .chip svg { flex-shrink:0; }
  .chip-time { background:#C8F14F; color:#1E3323; font-weight:800; }
  .friend-chip { margin-top:28px; display:inline-flex; align-items:center; gap:10px; background:#C8F14F; color:#1E3323; font-weight:800; font-size:24px; padding:14px 26px 14px 18px; border-radius:999px; }
  .bolt-mark { margin:90px auto 0 auto; width:160px; height:160px; border-radius:36px; background:rgba(200,241,79,0.12); display:flex; align-items:center; justify-content:center; }
  .bolt-mark svg { width:90px; height:90px; }
  .activity { margin-top:70px; text-align:center; color:#fff; font-weight:800; font-size:76px; line-height:1.05; }
  .host-row { margin-top:56px; display:flex; align-items:center; justify-content:center; gap:16px; }
  .avatar { width:56px; height:56px; border-radius:999px; background:#C8F14F; display:flex; align-items:center; justify-content:center; font-weight:800; color:#1E3323; font-size:26px; }
  .host-row span { color:rgba(255,255,255,0.55); font-weight:600; font-size:30px; }
  .host-row b { color:#fff; }
  .toast {
    position:absolute; top:498px; right:44px; background:#F4F3ED; border-radius:40px; padding:24px 34px;
    box-shadow:0 30px 60px -10px rgba(0,0,0,0.35); display:flex; align-items:center; gap:20px; width:560px;
  }
  .toast .ic { width:70px; height:70px; border-radius:999px; background:#C8F14F; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .toast .ic svg { width:34px; height:34px; }
  .toast b { font-size:30px; color:#131711; display:block; }
  .toast span { font-size:24px; color:#79826F; font-weight:500; }
  .bottombar { position:absolute; bottom:46px; left:0; right:0; display:flex; justify-content:center; gap:40px; }
  .bbtn { width:110px; height:110px; border-radius:999px; display:flex; align-items:center; justify-content:center; box-shadow:0 20px 40px -10px rgba(0,0,0,0.3); }
  .bbtn.no { background:#fff; }
  .bbtn.yes { background:#C8F14F; }
</style>
</head>
<body>
  <div class="pill">STEP 2</div>
  <div class="headline">Swipe right.<br><span class="accent">You're in.</span></div>
  <div class="sub">See Blitzes from friends<br>and people nearby.</div>

  <div class="phone">
    <div class="phone-screen">
      <div class="notch"></div>
      <div class="statusbar">
        <span>9:41</span>
        <div class="icons">
          <svg width="34" height="24" viewBox="0 0 34 24" fill="#131711"><rect x="0" y="16" width="6" height="8" rx="1"/><rect x="9" y="11" width="6" height="13" rx="1"/><rect x="18" y="6" width="6" height="18" rx="1"/><rect x="27" y="0" width="6" height="24" rx="1"/></svg>
          <svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="#131711" stroke-width="2.4"><path d="M2 8c7-7 19-7 26 0M6 13c5-4.5 13-4.5 18 0M10.5 17.5c2.7-2.3 6.3-2.3 9 0"/><circle cx="15" cy="20.5" r="1.4" fill="#131711" stroke="none"/></svg>
          <svg width="48" height="24" viewBox="0 0 48 24"><rect x="1" y="1" width="40" height="22" rx="6" stroke="#131711" stroke-width="2" fill="none"/><rect x="4" y="4" width="32" height="16" rx="3" fill="#131711"/><rect x="43" y="8" width="3" height="8" rx="1.5" fill="#131711"/></svg>
        </div>
      </div>
      <div class="appbar">
        <span class="logo">⚡ EVENDLE</span>
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#131711" stroke-width="2"><path d="M12 2a6 6 0 00-6 6v3.6c0 .7-.3 1.4-.8 1.9L4 15h16l-1.2-1.5c-.5-.5-.8-1.2-.8-1.9V8a6 6 0 00-6-6z"/></svg>
      </div>
      <div class="tabs">
        <div class="tab inactive">MY BLITZ</div>
        <div class="tab active">DISCOVER</div>
      </div>
      <div class="card">
        <div class="card-top">
          <span class="chip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8F14F" stroke-width="2.2"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>350 m</span>
          <span class="chip chip-time">59:10</span>
        </div>
        <div class="friend-chip"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E3323" stroke-width="2.4"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15 14.5c2.6.4 4.5 2.4 4.5 5.5"/></svg>FRIEND</div>
        <div class="bolt-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#C8F14F" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg></div>
        <div class="activity">Grab a<br>coffee ☕?</div>
        <div class="host-row"><div class="avatar">L</div><span><b>Lena</b> is hosting</span></div>
      </div>
      <div class="stamp"><span>I'M IN</span><svg width="48" height="48" viewBox="0 0 24 24" fill="#C8F14F"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg></div>
      <div class="bottombar">
        <div class="bbtn no"><svg width="40" height="40" viewBox="0 0 24 24" stroke="#131711" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
        <div class="bbtn yes"><svg width="44" height="44" viewBox="0 0 24 24" stroke="#1E3323" stroke-width="3" fill="none"><path d="M5 13l4 4L19 7"/></svg></div>
      </div>
    </div>
  </div>
</body>
</html>
